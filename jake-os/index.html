function scheduleFor(date){

 (state.tasks[date]||[]).forEach(t=>out.push({type:'task',title:t.title,detail:t.time||'Added task',id:t.id}));
 return out;

function nutTarget(date){
 const items=scheduleFor(date), hasLong=items.some(x=>/Long run/.test(x.title)), hasRun=items.some(x=>x.type==='run'), hasLift=items.some(x=>x.type==='lift');
 if(hasLong)return{cal:2700,protein:165,focus:'High-carb day',cue:'Fuel the long run — do not force a hard deficit.'};
 if(hasRun&&hasLift)return{cal:2450,protein:165,focus:'Run + lift',cue:'Carbs around training; keep protein steady.'};
 if(hasRun)return{cal:2350,protein:165,focus:'Run day',cue:'Easy run = normal meals, small carb bias.'};
 if(hasLift)return{cal:2300,protein:165,focus:'Lift day',cue:'Protein first; place carbs around the session.'};
 return{cal:2150,protein:165,focus:'Recovery',cue:'Lower-output day; keep protein high.'};
}
function completedKey(date,title){return date+'|'+title}

function exerciseTarget(ex,rx){let l=latestFor(ex);if(!l)return'Build a clean baseline.';let m=rx.match(/(\d+)\s*x\s*(\d+)-(\d+)/), reps=(l.setReps||[]).map(Number);if(!m||!reps.length)return'Beat the last clean performance.';let sets=+m[1],lo=+m[2],hi=+m[3];if(reps.length>=sets&&reps.slice(0,sets).every(v=>v>=hi)){let w=parseFloat(l.weight)||0;return w?`Ready to add load from ${w} lb.`:'Add reps or difficulty.'}return`Beat ${l.weight} lb · ${reps.join('/')} by 1–2 clean reps.`}

function renderWeek(){

function logExercise(split,name,rx,i,sets,btn){let weight=$('#w'+i).value.trim(),reps=[];for(let s=0;s<sets;s++){let v=$('#r'+i+'_'+s).value.trim();if(v)reps.push(v)}if(!weight||!reps.length){btn.textContent='Add load + reps';setTimeout(()=>btn.textContent='Save exercise',1200);return}state.lifting.push({date:todayISO(),exercise:name,split,weight,setReps:reps,rir:$('#rir'+i).value.trim(),rx});save();btn.classList.add('saved');btn.textContent='Saved ✓';setTimeout(renderTrain,700)}
function openWorkout(title){let m=title.match(/^(Push|Pull|Legs|Shoulders \+ abs) ([AB])$/);if(m){activeSplit=m[1]==='Shoulders + abs'?'Shoulders':m[1];activeVariant=m[2];showView('train',document.querySelector('[data-view=train]'))}}
function renderNutrition(){let d=todayISO(),n=nutTarget(d);$('#nutritionView').innerHTML=`<div class="eyebrow">Cut without trashing training</div><h1>Nutrition</h1><div class="subhead">Big picture only. No wall of advice.</div><div class="card food-hero"><div class="eyebrow">TODAY'S TARGET</div><div class="food-score"><div><span>Calories</span><strong>${n.cal.toLocaleString()}</strong></div><div><span>Protein</span><strong>${n.protein}g</strong></div><div><span>Focus</span><strong style="font-size:13px">${n.focus}</strong></div></div><div class="cue">${n.cue}</div></div><div class="section-title"><h3>What should I eat?</h3></div><div class="idea-grid"><div class="card idea"><div><b>Fast + high protein</b><small>Three options that fit the day without overthinking it.</small></div><button onclick="mealIdeas('fast')">Generate →</button></div><div class="card idea"><div><b>Pre / post run</b><small>Only useful when the run actually needs fueling.</small></div><button onclick="mealIdeas('run')">Generate →</button></div><div class="card idea"><div><b>Dinner</b><small>Simple meal that keeps the cut on track.</small></div><button onclick="mealIdeas('dinner')">Generate →</button></div><div class="card idea"><div><b>Snack</b><small>Protein-forward without burning the whole budget.</small></div><button onclick="mealIdeas('snack')">Generate →</button></div></div>`}
function mealIdeas(type){const map={fast:['Greek yogurt + berries + granola','Egg-white breakfast wrap + fruit','Chicken rice bowl with salsa'],run:['Bagel + banana before; shake + cereal after','Oatmeal + honey pre-run; eggs after','Rice + lean protein + fruit after'],dinner:['Salmon, rice, vegetables','Lean beef tacos + avocado','Chicken pasta + side salad'],snack:['Greek yogurt + whey','Cottage cheese + fruit','Protein shake + banana']};openInfo('Meal ideas',map[type])}
function renderProgress(){
 let c=state.checkins||[],latest=c[c.length-1]||{weight:165.7,bodyFat:18.9},delta=c.length>1?(latest.weight-c[c.length-2].weight):0;let svg=trendSVG(c.map(x=>x.weight));let movers=recentMovers().slice(0,4).map(x=>`<div class="plan-row"><div class="dot"></div><div><b>${x.exercise}</b><small>${x.detail}</small></div><span class="day-tag">↑</span></div>`).join('')||'<div class="empty">Lift a few sessions to build trends.</div>';
 $('#progressView').innerHTML=`<div class="eyebrow">Weekly trend, not daily noise</div><h1>Progress</h1><div class="subhead">One Monday check-in. Everything else stays low-maintenance.</div><div class="card progress-card" style="margin-top:16px"><div class="metric-row"><div><div class="eyebrow">BODY WEIGHT</div><strong>${(+latest.weight).toFixed(1)} <span style="font-size:14px;color:#667289">lb</span></strong></div><div class="delta">${delta>0?'+':''}${delta.toFixed(1)} lb</div></div>${svg}<div style="display:flex;justify-content:space-between;color:#657188;font-size:10px"><span>Goal pace</span><span>≈ -0.4 to -0.7 lb / week</span></div></div><div class="card checkin"><div class="eyebrow">MONDAY CHECK-IN</div><div class="checkin-grid"><label>Weight<input id="ciWeight" inputmode="decimal" placeholder="lb"></label><label>Body fat <span style="text-transform:none;color:#4e596c">optional</span><input id="ciFat" inputmode="decimal" placeholder="%"></label></div><button class="soft-btn" onclick="saveCheckin()">Save weekly check-in</button></div><div class="section-title"><h3>Strength moving</h3></div><div class="card plan">${movers}</div>`}
function trendSVG(vals){if(!vals.length)vals=[165.7];let w=330,h=86,min=Math.min(...vals)-.5,max=Math.max(...vals)+.5,pts=vals.map((v,i)=>{let x=vals.length===1?w/2:i*w/(vals.length-1),y=70-(v-min)/(max-min)*52;return[x,y]});let d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');return `<svg class="trend" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path class="grid" d="M0 70H330M0 44H330M0 18H330"/><path d="${d}"/></svg>`}
function recentMovers(){let map={};state.lifting.forEach(x=>(map[x.exercise]??=[]).push(x));let out=[];Object.entries(map).forEach(([exercise,a])=>{a.sort((x,y)=>y.date.localeCompare(x.date));if(a.length<2)return;let x=a[0],y=a[1],tx=(x.setReps||[]).reduce((s,v)=>s+(+v||0),0),ty=(y.setReps||[]).reduce((s,v)=>s+(+v||0),0);if(+x.weight>+y.weight||(+x.weight===+y.weight&&tx>ty))out.push({exercise,detail:`${y.weight} lb / ${ty} reps → ${x.weight} lb / ${tx} reps`,date:x.date})});return out.sort((a,b)=>b.date.localeCompare(a.date))}
function saveCheckin(){let w=parseFloat($('#ciWeight').value),f=parseFloat($('#ciFat').value);if(!w)return;state.checkins??=[];state.checkins.push({date:todayISO(),weight:w,bodyFat:Number.isFinite(f)?f:null,source:'manual'});save();renderProgress()}
function openReset(date=todayISO()){
 let wk=mondayOf(date);state.reset[wk]??={};
 let done=RESET_ITEMS.filter(x=>state.reset[wk][x]||((x==='PT + stretching')&&state.reset[wk]['PT'])).length;
 $('#resetContent').innerHTML=`<div class="eyebrow">WEEK OF ${shortDate(wk).toUpperCase()}</div><h2>Weekly Reset</h2><div class="subhead">${done} of ${RESET_ITEMS.length} complete · automatically fresh next week.</div><div class="card reset-list">${RESET_ITEMS.map(x=>{let checked=state.reset[wk][x]||((x==='PT + stretching')&&state.reset[wk]['PT']);return `<div class="reset-item"><input type="checkbox" id="rs_${x.replace(/\s/g,'_')}" ${checked?'checked':''} onchange="toggleReset('${wk}','${x}',this.checked)"><label for="rs_${x.replace(/\s/g,'_')}">${x}</label></div>`}).join('')}</div><div class="note">This checklist is stored separately from your daily page. Previous weeks remain saved in app data.</div>`;
 $('#resetOverlay').classList.add('show')
}
function closeReset(){$('#resetOverlay').classList.remove('show')}
function toggleReset(wk,item,v){state.reset[wk][item]=v;save()}

function itemLabel(type){
 return {lift:'LIFT',run:'RUN',reset:'RESET',recovery:'PT',checkin:'CHECK-IN',youtube:'YT',side:'BUILD',task:'TASK'}[type]||'PLAN';
}
function dayItemHTML(date,x){
 let done=!!state.completed[completedKey(date,x.title)];
 let action='';
 if(x.type==='lift') action=`openWorkout('${x.title.replace(/'/g,"\\'")}');closeModal()`;
 else if(x.type==='reset') action=`closeModal();openReset('${date}')`;
 else if(x.type==='checkin') action=`closeModal();showView('progress',document.querySelector('[data-view=progress]'))`;
 else if(x.type!=='run') action=`toggleDone('${date}','${x.title.replace(/'/g,"\\'")}');openDay('${date}')`;
 return `<div class="plan-row"><div class="plan-time">${itemLabel(x.type)}</div><div ${action?`onclick="${action}" style="cursor:pointer"`:''}><b>${x.title}</b><small>${x.detail||''}</small></div>${x.type==='run'?'<span class="dot"></span>':`<button class="check ${done?'done':''}" onclick="event.stopPropagation();toggleDone('${date}','${x.title.replace(/'/g,"\\'")}');openDay('${date}')">${done?'✓':''}</button>`}</div>`;
}
function openDay(date){
 const items=scheduleFor(date), n=nutTarget(date);
 $('#sheet').innerHTML=`<div class="grab"></div><div class="eyebrow">${rotation(date)} WEEK</div><h3 style="font-size:25px;margin:5px 0 4px">${fmtDate(date)}</h3><div class="subhead" style="margin-bottom:14px">Everything on this day, in one place.</div>
 <div class="card plan">${items.length?items.map(x=>dayItemHTML(date,x)).join(''):'<div class="empty">Nothing scheduled.</div>'}</div>
 <div class="card nutrition-strip" style="margin-top:12px"><div class="nut-cell"><span>Calories</span><strong>${n.cal.toLocaleString()}</strong></div><div class="nut-cell"><span>Protein</span><strong>${n.protein}g</strong></div><div class="nut-cell"><span>Focus</span><strong>${n.focus}</strong></div></div>
 <button class="soft-btn" onclick="openAddFor('${date}')">+ Add something to this day</button>
 <button class="soft-btn" onclick="closeModal()">Done</button>`;
 $('#modal').classList.add('show')
}
function openAddFor(date){
 $('#sheet').innerHTML=`<div class="grab"></div><h3>Add to ${fmtDate(date)}</h3><input id="taskTitle" placeholder="Haircut, appointment, errand…"><input id="taskTime" type="time"><input id="taskDate" type="date" value="${date}"><div class="sheet-actions"><button onclick="openDay('${date}')">Cancel</button><button class="primary" onclick="saveTask()">Add</button></div>`;
 $('#modal').classList.add('show')
}
function openAdd(){openAddFor(todayISO())}
function saveTask(){let title=$('#taskTitle').value.trim(),date=$('#taskDate').value||todayISO(),time=$('#taskTime').value;if(!title)return;state.tasks[date]??=[];state.tasks[date].push({id:Date.now(),title,time});save();closeModal();renderToday();renderWeek()} function closeModal(){$('#modal').classList.remove('show')}
function openInfo(title,items){$('#sheet').innerHTML=`<div class="grab"></div><h3>${title}</h3><div class="card plan">${items.map((x,i)=>`<div class="plan-row"><div class="day-tag">${i+1}</div><div><b>${x}</b></div></div>`).join('')}</div><button class="soft-btn" onclick="closeModal()">Done</button>`;$('#modal').classList.add('show')}
function openDataSheet(){$('#sheet').innerHTML=`<div class="grab"></div><h3>Jake OS</h3><div class="subhead" style="margin-bottom:14px">Health-first. Runna handles running. Your lift history stays local on this device.</div><button class="soft-btn" onclick="exportBackup()">Export app backup</button><button class="soft-btn" onclick="closeModal()">Close</button>`;$('#modal').classList.add('show')}
function exportBackup(){let blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),program:SEED.program,lifting:state.lifting,state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jake-os-backup-'+todayISO()+'.json';a.click();URL.revokeObjectURL(a.href)}
function showView(v,btn){$$('.view').forEach(x=>x.classList.remove('active'));$('#'+v+'View').classList.add('active');$$('.nav-btn').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');if(v==='today')renderToday();if(v==='week')renderWeek();if(v==='train')renderTrain();if(v==='nutrition')renderNutrition();if(v==='progress')renderProgress();window.scrollTo(0,0)}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
renderToday();renderWeek();renderTrain();renderNutrition();renderProgress();
if('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
</script>
</body></html>
